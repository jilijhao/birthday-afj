  :root{
    --bg:#03050a;
    --ink:#eef6ff;
    --gold:#ffd79a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    position:fixed;inset:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    touch-action:none;user-select:none;-webkit-user-select:none;
    overflow:hidden;
  }
  .glowfld{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(56% 40% at 50% 42%, rgba(54,102,208,.22), transparent 72%),
      radial-gradient(38% 28% at 86% 8%, rgba(120,74,220,.16), transparent 72%),
      radial-gradient(44% 30% at 8% 92%, rgba(18,170,180,.09), transparent 72%),
      radial-gradient(100% 100% at 50% 50%, transparent 52%, rgba(0,0,0,.60) 100%);
  }
  .codebg{
    position:fixed;top:0;left:0;right:0;height:100%;z-index:1;
    padding:calc(env(safe-area-inset-top,0px) + 72px) 12px 40px;
    font:8.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:rgba(96,140,224,.30);
    white-space:pre;overflow:hidden;pointer-events:none;
    -webkit-mask-image:linear-gradient(162deg,#000 0%,#000 14%,rgba(0,0,0,.38) 34%,transparent 48%);
    mask-image:linear-gradient(162deg,#000 0%,#000 14%,rgba(0,0,0,.38) 34%,transparent 48%);
  }
  canvas#sky{position:fixed;inset:0;z-index:4;pointer-events:none}

  .stage{
    position:relative;z-index:3;
    display:flex;flex-direction:column;align-items:center;
    width:100%;padding:0 14px;
    padding-top:calc(env(safe-area-inset-top,0px) + 44px);
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 4px);
  }
  .dome-wrap{position:relative;display:flex;justify-content:center;width:100%}

  .dome{
    position:relative;
    width:min(84vw,352px);
    aspect-ratio:1/1.03;
    border-radius:50% 50% 22px 22px / 46% 46% 5px 5px;
    overflow:hidden;
    background:
      radial-gradient(130% 86% at 50% -8%, rgba(150,198,255,.15), rgba(20,40,80,.05) 52%, transparent 74%),
      radial-gradient(62% 44% at 50% 72%, rgba(58,110,225,.13), transparent 72%),
      radial-gradient(34% 26% at 50% 34%, rgba(255,196,120,.12), transparent 70%);
    border:1px solid rgba(178,214,255,.22);
    box-shadow:
      inset 0 0 100px rgba(72,132,240,.13),
      inset 0 -34px 66px rgba(8,36,105,.38),
      inset 0 1px 0 rgba(255,255,255,.10),
      0 0 110px rgba(48,108,240,.16),
      0 0 26px rgba(120,180,255,.10);
    backdrop-filter:blur(1px);
  }
  .dome::before{
    content:"";position:absolute;left:7%;top:5%;width:23%;height:66%;
    border-radius:50%;z-index:7;pointer-events:none;
    background:linear-gradient(158deg, rgba(255,255,255,.24), rgba(255,255,255,.03) 52%, transparent 72%);
    filter:blur(7px);transform:rotate(-13deg);mix-blend-mode:screen;
  }
  .dome::after{
    content:"";position:absolute;left:3%;right:3%;bottom:0;height:14px;z-index:7;
    background:linear-gradient(to top, rgba(196,224,255,.24), rgba(196,224,255,.04) 55%, transparent);
  }
  .dome .side-rim{
    position:absolute;inset:0;z-index:6;pointer-events:none;border-radius:inherit;

  .arc{

    mix-blend-mode:screen;
  }
  .base{
    position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
    width:80%;height:13px;border-radius:50%;

    filter:blur(1.4px);
  }
  .base-glow{
    position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);

    background:radial-gradient(50% 50% at 50% 30%, rgba(86,150,255,.22), transparent 72%);
    filter:blur(8px);pointer-events:none;

  .domeSparks{
    position:absolute;inset:0;width:100%;height:100%;z-index:2;

  /* 星芒闪烁：只动透明度，避免覆盖 SVG 的 translate 定位 */
  @keyframes twinkle{
    0%,100%{opacity:.14}
    42%{opacity:1}
    64%{opacity:.6}
  }
  .tw{animation:twinkle 3.4s ease-in-out infinite}
  @keyframes bob{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-2.6px)}
  }
  .bob{will-change:transform}
  #flameG{transform-box:fill-box;transform-origin:50% 96%;animation:flick 1.5s ease-in-out infinite}
  @keyframes flick{
    0%,100%{transform:scale(1,1) translateX(0);opacity:.96}
    22%{transform:scale(1.1,.92) translateX(-.6px);opacity:1}
    47%{transform:scale(.9,1.1) translateX(.7px);opacity:.85}
    71%{transform:scale(1.06,.95) translateX(-.3px);opacity:1}

  #halo{animation:haloPulse 2.2s ease-in-out infinite}
  @keyframes haloPulse{0%,100%{opacity:.62}50%{opacity:1}}

  .caption{text-align:center;margin-top:clamp(18px,4.6vh,32px);width:100%}

    text-shadow:
      0 0 14px rgba(176,214,255,.55),

  }
  .to{

    color:rgba(206,224,248,.62);
    animation:rise 1.3s 1.05s ease;
  }
  .to b{color:rgba(236,245,255,.95);font-weight:500;letter-spacing:.30em}
  @keyframes rise{
    from{opacity:0;transform:translateY(9px)}
    to{opacity:1;transform:translateY(0)}

  .hb.lit{text-shadow:
    0 0 18px rgba(226,242,255,.95),
    0 0 54px rgba(140,190,255,.75),
    0 0 110px rgba(90,150,255,.55)}

  /* 红布横幅：布纹 + 上沿高光 + 下沿暗边 */
  /* 点击头像弹出的个人档案 */
  .profile{
    position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    padding:24px;opacity:0;pointer-events:none;
    transition:opacity .3s ease;

    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);

  .profile.on{opacity:1;pointer-events:auto}
  .profile-card{
    position:relative;width:min(84vw,320px);
    padding:22px 20px 15px;border-radius:20px;text-align:center;

      radial-gradient(120% 60% at 50% -10%, rgba(90,150,255,.18), transparent 62%),
      linear-gradient(180deg, rgba(17,29,52,.97), rgba(7,12,24,.99));
    border:1px solid rgba(255,214,150,.30);
    box-shadow:
      0 26px 64px rgba(0,0,0,.62),
      inset 0 1px 0 rgba(255,255,255,.09),
      0 0 46px rgba(60,120,240,.18);
    transform:translateY(14px) scale(.93);opacity:0;
    transition:transform .36s cubic-bezier(.2,.9,.2,1), opacity .3s;
  }
  .profile.on .profile-card{transform:none;opacity:1}
  .profile.on.final{opacity:1;transition:none}
  .profile.on.final .profile-card{opacity:1;transform:none;transition:none}

  .pf-avatar{

  .pf-name{

    position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 15px);

<script src="three.min.js"></script>
<script>
(function(){
  "use strict";

  /* ============ 只改这里 ============ */
  var CONFIG = {
    name: "空军杰",
    prefix: "送 ",
    title: "Happy birthday",
    hint: "轻触屏幕，放朵烟花 ✦",
    hintAfter: "愿望许下了 ✦ 再点几下，烟花管够"
  };
  /* ================================ */

  document.title = CONFIG.title + " · " + CONFIG.name;
  var hbEl = document.getElementById("hb");
  var toEl = document.getElementById("to");
  var hintEl = document.getElementById("hint");
  hbEl.textContent = CONFIG.title;
  toEl.innerHTML = CONFIG.prefix + "<b>" + CONFIG.name + "</b>";
  hintEl.textContent = CONFIG.hint;

  function fitTitle(){
    hbEl.style.fontSize = "";
    var box = hbEl.parentElement.clientWidth;
    var w = hbEl.scrollWidth;
    if (w > box && box > 0){
      var cur = parseFloat(window.getComputedStyle(hbEl).fontSize) || 32;
      hbEl.style.fontSize = (cur * box / w * .97).toFixed(1) + "px";
    }
  }
  fitTitle();
  window.addEventListener("load", fitTitle);
  setTimeout(fitTitle, 300);

  /* ================= 蛋糕上的星星 ================= */
  var NS = "http://www.w3.org/2000/svg";
  function glintPath(s){
    var k = s * .17;
    return "M0," + (-s) +
      " Q" + k + "," + (-k) + " " + s + ",0" +
      " Q" + k + "," + k + " 0," + s +
      " Q" + (-k) + "," + k + " " + (-s) + ",0" +
      " Q" + (-k) + "," + (-k) + " 0," + (-s) + " Z";
  }
  var STAR_COLORS = ["#fff6dc","#ffe6ae","#ffd79a","#ffffff","#dbeaff","#b9d7ff","#f0e6ff","#a8f0e4"];

  function addStar(parent, x, y, s, color, big){
    var g = document.createElementNS(NS, "g");
    g.setAttribute("transform", "translate(" + x.toFixed(1) + "," + y.toFixed(1) + ")");
    g.setAttribute("class", "tw");
    g.style.animationDelay = (-Math.random() * 4).toFixed(2) + "s";
    g.style.animationDuration = (2.2 + Math.random() * 3.2).toFixed(2) + "s";

    if (big){
      var halo = document.createElementNS(NS, "circle");
      halo.setAttribute("r", (s * 2.4).toFixed(2));
      halo.setAttribute("fill", color);
      halo.setAttribute("opacity", ".16");
      halo.setAttribute("filter", "url(#soft2)");
      g.appendChild(halo);
    }
    var core = document.createElementNS(NS, "path");
    core.setAttribute("d", glintPath(s));
    core.setAttribute("fill", color);
    core.setAttribute("filter", "url(#glint)");
    g.appendChild(core);

    if (big){
      var rays = document.createElementNS(NS, "g");
      rays.setAttribute("stroke", color);
      rays.setAttribute("stroke-width", ".55");
      rays.setAttribute("opacity", ".55");
      rays.setAttribute("stroke-linecap", "round");
      var L = s * 2.6;
      var lines = [
        [0, -L, 0, L],
        [-L, 0, L, 0]
      ];
      for (var i = 0; i < lines.length; i++){
        var ln = document.createElementNS(NS, "path");
        ln.setAttribute("d", "M" + lines[i][0] + "," + lines[i][1] + " L" + lines[i][2] + "," + lines[i][3]);
        rays.appendChild(ln);
      }
      g.appendChild(rays);
    }
    parent.appendChild(g);
  }

  function buildStars(){
    var g = document.getElementById("cakeStars");
    if (!g) return;
    for (var i = 0; i < 74; i++){
      var x = 124 + Math.random() * 88;
      var y = 106 + Math.pow(Math.random(), .8) * 106;
      var big = Math.random() < .14;
      var s = big ? 3.0 + Math.random() * 2.0
                  : (Math.random() < .45 ? 1.6 + Math.random() * .9
                                         : .8 + Math.random() * .7);
      addStar(g, x, y, s, STAR_COLORS[(Math.random() * STAR_COLORS.length) | 0], big);
    }
    // 奶油面上的碎钻
    for (var j = 0; j < 12; j++){
      var ang = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * 42;
      var dx = 168 + Math.cos(ang) * rr;
      var dy = 92 + Math.sin(ang) * rr * .20;
      addStar(g, dx, dy, .7 + Math.random() * 1.0,
        Math.random() < .5 ? "#ffffff" : "#ffe9bd", false);
    }
    // 头像周围漂浮的小星
    for (var k = 0; k < 7; k++){
      var a2 = Math.random() * Math.PI * 2, r2 = 46 + Math.random() * 12;
      addStar(g, 76 + Math.cos(a2) * r2, 168 + Math.sin(a2) * r2,
        .7 + Math.random() * .9, Math.random() < .6 ? "#ffe9bd" : "#dbeaff", false);
    }
  }
  buildStars();

  /* 玻璃罩内的星空 */
  function buildDomeStars(){
    var g = document.getElementById("domeStars");
    if (!g) return;
    for (var i = 0; i < 26; i++){
      var x = 10 + Math.random() * 320;
      var y = 12 + Math.random() * 300;
      var big = Math.random() < .20;
      var s = big ? 4.4 + Math.random() * 2.8
                  : (Math.random() < .5 ? 2.1 + Math.random() * 1.3
                                        : 1.0 + Math.random() * 1.0);
      addStar(g, x, y, s, STAR_COLORS[(Math.random() * STAR_COLORS.length) | 0], big);
    }
  }
  buildDomeStars();

  /* ================= 画布 ================= */
  var cvs = document.getElementById("sky");
  var ctx = cvs.getContext("2d");
  var W = 0, H = 0, DPR = 1;
  var bgStars = [], dust = [], sparks = [], confetti = [], shooting = null;
  var faceImg = null, avatars = [];
  var flamePt = {x:0, y:0};
  var t0 = performance.now(), last = t0, volleyT = 1.0, domeFwT = 1.6;

  /* ---------- 罩内快速乱撞的小星星 ---------- */
  var dc = document.getElementById("domeSparks");
  var dctx = dc ? dc.getContext("2d") : null;
  var dW = 0, dH = 0, domeStars = [];

  function domeResize(){
    if (!dc || !dctx) return;
    var r = dc.getBoundingClientRect();
    if (!r.width) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    dW = r.width; dH = r.height;
    dc.width = Math.floor(dW * dpr);
    dc.height = Math.floor(dH * dpr);
    dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildDomeSparks();
  }

  function buildDomeSparks(){
    var n = 26, cx = dW * .5, cy = dH * .5, rx = dW * .46, ry = dH * .46;
    domeStars = [];
    for (var i = 0; i < n; i++){
      var a = Math.random() * 6.2832, k = Math.sqrt(Math.random()) * .82;
      var sp = rnd(70, 165);
      var ang = Math.random() * 6.2832;
      domeStars.push({
        x: cx + Math.cos(a) * rx * k,
        y: cy + Math.sin(a) * ry * k,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        s: rnd(1.1, 2.9),
        ph: Math.random() * 6.2832,
        warm: Math.random() < .42
      });
    }
  }

  function drawDomeSparks(t, dt){
    if (!dctx || !dW) return;
    var cx = dW * .5, cy = dH * .5, rx = dW * .46, ry = dH * .46;
    dctx.clearRect(0, 0, dW, dH);
    dctx.save();
    dctx.globalCompositeOperation = "lighter";

    for (var i = 0; i < domeStars.length; i++){
      var p = domeStars[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      // 椭圆边界：撞到玻璃就反弹
      var dx = p.x - cx, dy = p.y - cy;
      if ((dx * dx) / (rx * rx) + (dy * dy) / (ry * ry) > 1){
        var gx = dx / (rx * rx), gy = dy / (ry * ry);
        var gl = Math.sqrt(gx * gx + gy * gy) || 1;
        gx /= gl; gy /= gl;
        var dot = p.vx * gx + p.vy * gy;
        p.vx -= 2 * dot * gx;
        p.vy -= 2 * dot * gy;
        // 再快一点，别越弹越慢
        var spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        if (spd < 90){ p.vx *= 1.35; p.vy *= 1.35; }
        p.x -= gx * 4;
        p.y -= gy * 4;
      }

      var a2 = .55 + .45 * Math.sin(t * 7 + p.ph);
      var col = p.warm ? "255,232,180" : "198,226,255";
      var s2 = p.s * (2.6 + a2);

      // 光晕
      var rg = dctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, s2);
      rg.addColorStop(0, "rgba(" + col + "," + (a2 * .55).toFixed(3) + ")");
      rg.addColorStop(1, "rgba(" + col + ",0)");
      dctx.fillStyle = rg;
      dctx.beginPath();
      dctx.arc(p.x, p.y, s2, 0, 6.2832);
      dctx.fill();

      // 四芒星本体
      var L = p.s * (1.5 + a2 * .9), Wd = p.s * .30;
      dctx.beginPath();
      dctx.moveTo(p.x, p.y - L);
      dctx.quadraticCurveTo(p.x + Wd, p.y - Wd, p.x + L, p.y);
      dctx.quadraticCurveTo(p.x + Wd, p.y + Wd, p.x, p.y + L);
      dctx.quadraticCurveTo(p.x - Wd, p.y + Wd, p.x - L, p.y);
      dctx.quadraticCurveTo(p.x - Wd, p.y - Wd, p.x, p.y - L);
      dctx.fillStyle = "rgba(" + col + "," + (.45 + a2 * .55).toFixed(3) + ")";
      dctx.fill();
    }
    dctx.restore();
  }

  /* ---------- 满屏漂浮的寿星头像 ---------- */
  function initFace(){
    var holder = document.getElementById("faceSrc");
    if (!holder || !holder.src) return;
    var im = new Image();
    im.onload = function(){ faceImg = im; buildAvatars(); };
    im.src = holder.src;
  }

  function newAvatar(){
    var r = rnd(17, 40);
    var sp = rnd(28, 78);
    var ang = Math.random() * Math.PI * 2;
    return {
      x: rnd(r, Math.max(r + 1, W - r)),
      y: rnd(r, Math.max(r + 1, H - r)),
      r: r,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      a: rnd(.09, .24)
    };
  }

  function buildAvatars(){
    avatars = [];
    var n = Math.max(6, Math.min(11, Math.round(W / 46)));
    for (var i = 0; i < n; i++) avatars.push(newAvatar());
  }

  function drawAvatars(t, dt){
    if (!faceImg || !avatars.length) return;
    for (var i = 0; i < avatars.length; i++){
      var av = avatars[i];
      av.x += av.vx * dt;
      av.y += av.vy * dt;
      // 撞墙反弹，一直在屏幕里乱飞
      if (av.x < av.r){ av.x = av.r; av.vx = Math.abs(av.vx); }
      else if (av.x > W - av.r){ av.x = W - av.r; av.vx = -Math.abs(av.vx); }
      if (av.y < av.r){ av.y = av.r; av.vy = Math.abs(av.vy); }
      else if (av.y > H - av.r){ av.y = H - av.r; av.vy = -Math.abs(av.vy); }
      // 偶尔拐个弯，别老是直线
      if (Math.random() < .004){
        var ang2 = Math.atan2(av.vy, av.vx) + rnd(-.9, .9);
        var sp2 = Math.hypot(av.vx, av.vy);
        av.vx = Math.cos(ang2) * sp2;
        av.vy = Math.sin(ang2) * sp2;
      }
      ctx.save();
      ctx.globalAlpha = av.a;
      ctx.beginPath();
      ctx.arc(av.x, av.y, av.r, 0, 6.2832);
      ctx.clip();
      ctx.drawImage(faceImg, av.x - av.r, av.y - av.r, av.r * 2, av.r * 2);
      ctx.restore();

      ctx.beginPath();
      ctx.arc(av.x, av.y, av.r, 0, 6.2832);
      ctx.strokeStyle = "rgba(208,232,255," + Math.min(.85, av.a * 1.8).toFixed(3) + ")";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = Math.floor(W * DPR);
    cvs.height = Math.floor(H * DPR);
    cvs.style.width = W + "px";
    cvs.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildSky();
    domeResize();
    if (faceImg) buildAvatars();
    syncFlame();
  }

  function buildSky(){
    var n = Math.max(70, Math.min(190, Math.round(W * H / 5200)));
    bgStars = [];
    for (var i = 0; i < n; i++){
      var big = Math.random() < .07;
      bgStars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: big ? 1.1 + Math.random() * .9 : .35 + Math.random() * .75,
        ph: Math.random() * 6.28, sp: .5 + Math.random() * 2.2,
        base: .16 + Math.random() * .55, big: big,
        hue: Math.random() < .26 ? 44 : (Math.random() < .55 ? 205 : 220)
      });
    }
    dust = [];
    var m = Math.max(24, Math.round(W * H / 26000));
    for (var k = 0; k < m; k++){
      dust.push({
        x: Math.random() * W, y: Math.random() * H,
        r: .6 + Math.random() * 1.1,
        vy: 4 + Math.random() * 12,
        sw: .2 + Math.random() * .7,
        ph: Math.random() * 6.28,
        hue: Math.random() < .5 ? 42 : 205
      });
    }
  }

  function syncFlame(){
    if (window.FLAME_PT && window.FLAME_PT.x > 0){
      flamePt.x = window.FLAME_PT.x;
      flamePt.y = window.FLAME_PT.y;
      return;
    }
    var el = document.getElementById("flameG");
    if (!el) return;
    var r = el.getBoundingClientRect();
    if (r.width > 0){
      flamePt.x = r.left + r.width / 2;
      flamePt.y = r.top + r.height * .16;
    }
  }

  function rnd(a, b){ return a + Math.random() * (b - a); }

  function hexToRgb(h){
    var n = parseInt(h.slice(1), 16);
    return ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255);
  }

  var SHELLS = [
    ["#ffd79a", "#ffe9c2", "#fff6dc", "#ffb347"],
    ["#cfe4ff", "#ffffff", "#9ec2ff", "#e8f4ff"],
    ["#f0e6ff", "#ffffff", "#c9aaff", "#e6d9ff"],
    ["#ffc9de", "#ffffff", "#ff9ec2", "#ffd9e6"],
    ["#a8f0e4", "#ffffff", "#7fe8d8", "#d6fff8"]
  ].map(function(p){ return p.map(hexToRgb); });

  var WARM = "255,224,158", COOL = "190,232,255";
  var rockets = [], flashes = [];

  function pushSpark(o){
    sparks.push(o);
    if (sparks.length > 1600) sparks.splice(0, 320);
  }

  function spawnSpark(x, y, spread, power){
    var ang = Math.random() * Math.PI * 2;
    var sp = rnd(0, power);
    pushSpark({
      x: x + rnd(-spread, spread),
      y: y + rnd(-spread * .6, spread * .6),
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp - rnd(24, 80),
      g: rnd(80, 170), drag: .7, life: 0,
      max: rnd(.6, 1.7), r: rnd(.6, 1.9),
      trail: Math.random() < .35,
      rgb: Math.random() < .85 ? WARM : COOL
    });
  }

  /* 发射一枚烟花：从底部窜到点击位置再炸开 */
  function launch(tx, ty, wait, light){
    var sx = Math.max(10, Math.min(W - 10, tx + rnd(-22, 22)));
    var sy = H + 8, g = 300;
    var dist = Math.max(120, sy - ty);
    var dur = Math.max(.42, Math.min(1.05, dist / 760));
    rockets.push({
      x: sx, y: sy,
      vx: (tx - sx) / dur,
      vy: -(dist / dur) - .5 * g * dur,
      g: g, t: 0, dur: dur, wait: wait || 0,
      light: !!light,
      pal: SHELLS[(Math.random() * SHELLS.length) | 0]
    });
  }

  /* 一轮 6 发，从底部同时升空 */
  function volley(){
    for (var i = 0; i < 6; i++){
      var col = i % 3, row = (i / 3) | 0;      // 3 列 × 2 排，六朵互不重叠
      var tx = W * (.20 + .30 * col) + rnd(-12, 12);
      var ty = H * (row ? .30 : .17) + rnd(-12, 12);
      launch(tx, ty, i * .10, true);
    }
  }

  function explode(x, y, pal, budget){
    var n = budget || (128 + ((Math.random() * 62) | 0));
    var base = budget ? rnd(150, 205) : rnd(230, 360);
    for (var i = 0; i < n; i++){
      var ang = Math.random() * 6.2832;
      // 壳体速度接近，炸出来是球面而不是一团
      var sp = base * (.84 + Math.random() * .16);
      if (Math.random() < .32) sp *= rnd(.34, .72);
      pushSpark({
        x: x, y: y,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        g: 95, drag: .45, life: 0,
        max: rnd(1.2, 2.0), r: rnd(1.1, 2.7),
        trail: true, shell: true,
        rgb: pal[(Math.random() * pal.length) | 0]
      });
    }
    for (var j = 0; j < 26; j++){
      var a2 = Math.random() * 6.2832, s2 = rnd(20, 95);
      pushSpark({
        x: x, y: y,
        vx: Math.cos(a2) * s2, vy: Math.sin(a2) * s2,
        g: 60, drag: .4, life: 0,
        max: rnd(.5, .95), r: rnd(1, 2.6),
        trail: false, rgb: "255,255,255"
      });
    }
    flashes.push({ x: x, y: y, life: 0, dur: .5, max: rnd(58, 108), rgb: pal[0] });
  }

  /* 罩子里的小烟花：速度更小，别一下飞出去 */
  function domeBurst(x, y){
    var pal = SHELLS[(Math.random() * SHELLS.length) | 0];
    var n = 30 + ((Math.random() * 16) | 0);
    for (var i = 0; i < n; i++){
      var ang = Math.random() * 6.2832;
      var sp = rnd(55, 190);
      pushSpark({
        x: x, y: y,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        g: 70, drag: .55, life: 0,
        max: rnd(.7, 1.4), r: rnd(.8, 1.9),
        trail: true, shell: true,
        rgb: pal[(Math.random() * pal.length) | 0]
      });
    }
    for (var j = 0; j < 10; j++){
      var a2 = Math.random() * 6.2832, s2 = rnd(12, 55);
      pushSpark({
        x: x, y: y, vx: Math.cos(a2) * s2, vy: Math.sin(a2) * s2,
        g: 40, drag: .4, life: 0, max: rnd(.35, .7),
        r: rnd(1, 2.2), trail: false, rgb: "255,255,255"
      });
    }
    flashes.push({ x: x, y: y, life: 0, dur: .38, max: 42, rgb: pal[0] });
  }

  function burst(x, y, n, pal){
    pal = pal || SHELLS[0];
    for (var i = 0; i < n; i++){
      var ang = Math.random() * Math.PI * 2;
      var sp = rnd(110, 520) * (Math.random() < .35 ? .45 : 1);
      pushSpark({
        x: x, y: y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp * .85 - 70,
        g: rnd(120, 250), drag: .9, life: 0,
        max: rnd(.85, 1.9), r: rnd(.8, 2.3),
        trail: true,
        rgb: pal[(Math.random() * pal.length) | 0]
      });
    }
  }

  var CONF_COLORS = ["#ffd79a","#ffe9c2","#cfe4ff","#ffffff","#b9d7ff","#f0e6ff"];
  function confettiRain(n){
    for (var i = 0; i < n; i++){
      confetti.push({
        x: Math.random() * W, y: -rnd(20, 320),
        vx: rnd(-20, 20), vy: rnd(38, 105),
        w: rnd(1.6, 3.6), h: rnd(4, 9),
        rot: Math.random() * 6.28, vr: rnd(-2.6, 2.6),
        c: CONF_COLORS[(Math.random() * CONF_COLORS.length) | 0],
        life: 0, max: rnd(4, 7)
      });
    }
  }

  var lastFrameAt = 0, errCount = 0;
  function recordErr(e){
    errCount++;
    window.__err = (window.__err ? window.__err + " | " : "") + ((e && e.message) ? e.message : String(e));
    if (errCount === 1 && /debug/.test(location.search)){
      var d = document.createElement("div");
      d.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:99;background:rgba(120,0,0,.92);" +
        "color:#fff;font:11px/1.5 monospace;padding:8px;max-height:38%;overflow:auto;white-space:pre-wrap";
      d.textContent = "ERR: " + ((e && e.stack) ? e.stack : e);
      document.body.appendChild(d);
    }
  }

  function stepBody(now){
    var dt = Math.min((now - last) / 1000, .05);
    last = now;
    var t = (now - t0) / 1000;
    ctx.clearRect(0, 0, W, H);

    try { drawAvatars(t, dt); } catch(err){ recordErr(err); }
    try { drawDomeSparks(t, dt); } catch(err){ recordErr(err); }

    try {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < bgStars.length; i++){
      var st = bgStars[i];
      var a = st.base * (.35 + .65 * Math.sin(t * st.sp + st.ph));
      if (a <= .02) continue;
      ctx.fillStyle = "hsla(" + st.hue + ",92%,88%," + a.toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, 6.2832);
      ctx.fill();
      if (st.big){
        var L = st.r * 5.2;
        ctx.strokeStyle = "hsla(" + st.hue + ",96%,92%," + (a * .55).toFixed(3) + ")";
        ctx.lineWidth = .6;
        ctx.beginPath();
        ctx.moveTo(st.x - L, st.y); ctx.lineTo(st.x + L, st.y);
        ctx.moveTo(st.x, st.y - L); ctx.lineTo(st.x, st.y + L);
        ctx.stroke();
      }
    }
    for (var d = 0; d < dust.length; d++){
      var p = dust[d];
      p.y -= p.vy * dt;
      p.x += Math.sin(t * p.sw + p.ph) * .4;
      if (p.y < -8){ p.y = H + 8; p.x = Math.random() * W; }
      var da = .12 + .28 * (.5 + .5 * Math.sin(t * 1.6 + p.ph));
      ctx.fillStyle = "hsla(" + p.hue + ",95%,85%," + da.toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fill();
    }

    if (flamePt.x > 0){
      if (Math.random() < .9) spawnSpark(flamePt.x, flamePt.y, 3.2, 30);
      if (Math.random() < .16) spawnSpark(flamePt.x, flamePt.y, 6, 120);
    }

    /* 烟花弹升空 */
    for (var r = rockets.length - 1; r >= 0; r--){
      var rk = rockets[r];
      if (rk.wait > 0){ rk.wait -= dt; continue; }
      rk.t += dt;
      rk.x += rk.vx * dt;
      rk.y += rk.vy * dt;
      rk.vy += rk.g * dt;
      for (var q = 0; q < 2; q++){
        pushSpark({
          x: rk.x + rnd(-1.4, 1.4), y: rk.y,
          vx: rnd(-14, 14), vy: rnd(20, 70),
          g: 30, drag: .8, life: 0, max: rnd(.22, .5),
          r: rnd(.5, 1.3), trail: false,
          rgb: Math.random() < .5 ? WARM : "255,255,235"
        });
      }
      ctx.beginPath();
      ctx.arc(rk.x, rk.y, 2.2, 0, 6.2832);
      ctx.fillStyle = "rgba(255,250,230,.95)";
      ctx.fill();
      if (rk.t >= rk.dur){
        explode(rk.x, rk.y, rk.pal, rk.light ? 72 : 0);
        rockets.splice(r, 1);
      }
    }

    for (var j = sparks.length - 1; j >= 0; j--){
      var s = sparks[j];
      s.life += dt;
      if (s.life >= s.max){ sparks.splice(j, 1); continue; }
      var px = s.x, py = s.y;
      s.vy += s.g * dt;
      s.vx *= (1 - (s.drag || 1.4) * dt);
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      var k = 1 - s.life / s.max;
      var alpha = s.shell ? Math.min(1, k * 1.55) : k * k;
      alpha *= .86 + .14 * Math.sin(s.life * 34 + s.x * .7);
      var col = s.rgb || (s.warm ? WARM : COOL);
      if (s.trail){
        // 彗尾：按速度取固定时间长度，帧率无关
        ctx.strokeStyle = "rgba(" + col + "," + (alpha * .58).toFixed(3) + ")";
        ctx.lineWidth = Math.max(.6, s.r * .7 * (.35 + k * .65));
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(s.x - s.vx * .045, s.y - s.vy * .045);
        ctx.lineTo(s.x, s.y);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * (.4 + k * .8), 0, 6.2832);
      ctx.fillStyle = "rgba(" + col + "," + alpha.toFixed(3) + ")";
      ctx.fill();
    }

    /* 爆闪 */
    for (var f = flashes.length - 1; f >= 0; f--){
      var fl = flashes[f];
      fl.life += dt;
      var fk = fl.life / fl.dur;
      if (fk >= 1){ flashes.splice(f, 1); continue; }
      var ease = 1 - Math.pow(1 - fk, 2.2);
      var rad = fl.max * (.25 + ease * .95);
      var fg = ctx.createRadialGradient(fl.x, fl.y, 0, fl.x, fl.y, rad);
      fg.addColorStop(0, "rgba(255,255,255," + (.55 * (1 - fk)).toFixed(3) + ")");
      fg.addColorStop(.34, "rgba(" + fl.rgb + "," + (.34 * (1 - fk)).toFixed(3) + ")");
      fg.addColorStop(1, "rgba(" + fl.rgb + ",0)");
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.arc(fl.x, fl.y, rad, 0, 6.2832);
      ctx.fill();
    }
    ctx.restore();

    for (var m = confetti.length - 1; m >= 0; m--){
      var c = confetti[m];
      c.life += dt;
      if (c.life >= c.max || c.y > H + 40){ confetti.splice(m, 1); continue; }
      c.vy += 36 * dt;
      c.y += c.vy * dt;
      c.x += (c.vx + Math.sin(t * 1.8 + c.rot) * 14) * dt;
      c.rot += c.vr * dt;
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      ctx.globalAlpha = Math.min(1, (c.max - c.life) * 1.2) * .85;
      ctx.fillStyle = c.c;
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.restore();
    }

    if (shooting){
      shooting.x += shooting.vx * dt;
      shooting.y += shooting.vy * dt;
      shooting.life -= dt;
      var sa = Math.max(0, shooting.life) * .85;
      var grad = ctx.createLinearGradient(shooting.x, shooting.y,
        shooting.x - shooting.vx * .1, shooting.y - shooting.vy * .1);
      grad.addColorStop(0, "rgba(214,236,255," + sa + ")");
      grad.addColorStop(1, "rgba(214,236,255,0)");
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(shooting.x, shooting.y);
      ctx.lineTo(shooting.x - shooting.vx * .1, shooting.y - shooting.vy * .1);
      ctx.stroke();
      if (shooting.life <= 0) shooting = null;
    } else if (Math.random() < .0018){
      shooting = {
        x: rnd(W * .25, W * .92), y: rnd(0, H * .32),
        vx: rnd(-660, -420), vy: rnd(170, 320), life: 1.05
      };
    }

    /* 罩内小星星乱撞的同时，玻璃罩里也冒小烟花 */
    domeFwT -= dt;
    if (domeFwT <= 0 && dc){
      var dr = dc.getBoundingClientRect();
      if (dr.width > 0){
        var dax = Math.random() * 6.2832, drad = Math.random() * dr.width * .28;
        domeBurst(
          dr.left + dr.width * .5 + Math.cos(dax) * drad,
          dr.top + dr.height * .42 + Math.sin(dax) * drad * .8
        );
      }
      domeFwT = rnd(2.2, 3.8);
    }

    /* 一直放：每轮 6 发齐射 */
    volleyT -= dt;
    if (volleyT <= 0){
      volley();
      volleyT = rnd(3.4, 5.0);
    }

    } catch(err){ recordErr(err); try { ctx.restore(); } catch(e2){} }
  }

  function step(now){
    lastFrameAt = Date.now();
    try { stepBody(now); } catch(err){ recordErr(err); }
    try { requestAnimationFrame(step); } catch(e){}
  }

  /* 兜底驱动：内嵌浏览器限制 rAF 时用定时器接管 */
  setInterval(function(){
    if (Date.now() - lastFrameAt > 200){
      var n = (window.performance && performance.now) ? performance.now() : Date.now();
      step(n);
    }
  }, 80);

  /* ================= 背景代码 ================= */
  var codeLines = [
    "// birthday.js — 一个会发光的生日蛋糕",
    "import { cake, candle, wish } from './heart.js';",
    "",
    "const cake = {",
    "  base  : 'chocolate',",
    "  glaze : 'vanilla',",
    "  sky   : 'deep-space',",
    "  glaze.color = '#f4f9ff';",
    "",
    "  sparkle(x).onEach(dot => {",
    "    dot.tint(['#ffd79a','#dbeaff','#ffffff']);",
    "    dot.emit('twinkle', 3);",
    "  });",
    "",
    "  candle.light().then(() => {",
    "    world.ambient = 0.16;",
    "    world.center(cake).zoom(1.06);",
    "  });",
    "",
    "  if (candle.blown) {",
    "    wish.commit('all come true');",
    "  }",
    "};",
    "",
    "wish.register(name => ({",
    "  to   : name,",
    "  wish : '岁岁平安，常有惊喜',",
    "}));",
    "",
    "(() => {",
    "  scene.render('#sky');",
    "  scene.start();",
    "  listen('touch:start', ctx => {",
    "    sparkle(ctx.x, ctx.y, 96);",
    "    music.play();",
    "  });",
    "})();"
  ];

  var codeEl = document.getElementById("codebg");
  var buf = "", li = 0, ci = 0;
  function typeCode(){
    if (li >= codeLines.length){
      setTimeout(function(){ buf = ""; li = 0; ci = 0; codeEl.textContent = ""; typeCode(); }, 9000);
      return;
    }
    var line = codeLines[li];
    if (ci <= line.length){
      codeEl.textContent = buf + line.slice(0, ci);
      ci++;
      setTimeout(typeCode, line.length ? 8 + Math.random() * 16 : 45);
    } else {
      buf += line + "\n";
      li++; ci = 0;
      setTimeout(typeCode, 65);
    }
  }

  /* ================= 音乐 ================= */
  var AC = null, sndOn = false, musicTimer = null;
  var NF = { G4:392.00, A4:440.00, B4:493.88, C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99 };
  var MELODY = [
    ["G4",.5],["G4",.5],["A4",1],["G4",1],["C5",1],["B4",2],
    ["G4",.5],["G4",.5],["A4",1],["G4",1],["D5",1],["C5",2],
    ["G4",.5],["G4",.5],["G5",1],["E5",1],["C5",1],["B4",1],["A4",1],
    ["F5",.5],["F5",.5],["E5",1],["C5",1],["D5",1],["C5",2]
  ];

  function playMusic(){
    if (!AC){
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      AC = new Ctx();
    }
    if (AC.state === "suspended") AC.resume();
    var beat = 0.40, at = AC.currentTime + 0.12;
    var master = AC.createGain();
    master.gain.value = 0.14;
    var lp = AC.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 2500;
    master.connect(lp);
    lp.connect(AC.destination);

    for (var i = 0; i < MELODY.length; i++){
      var f = NF[MELODY[i][0]], dur = MELODY[i][1] * beat;
      var osc = AC.createOscillator(), g = AC.createGain();
      osc.type = "triangle";
      osc.frequency.value = f;
      osc.connect(g); g.connect(master);
      var rel = Math.min(0.35, dur * 0.6);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.9, at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur + rel);
      osc.start(at);
      osc.stop(at + dur + rel + 0.02);
      at += dur;
    }
    if (musicTimer) clearTimeout(musicTimer);
    musicTimer = setTimeout(function(){ if (sndOn) playMusic(); },
      (at - AC.currentTime) * 1000 + 1500);
  }

  function stopMusic(){
    if (musicTimer){ clearTimeout(musicTimer); musicTimer = null; }
    if (AC && AC.state === "running") AC.suspend();
  }

  /* 优先播 bgm.mp3（放同目录即可），没有就退回内置生日快乐旋律 */
  var bgm = document.getElementById("bgm");
  var bgmOk = false, bgmTried = false;
  if (bgm){
    bgm.addEventListener("canplaythrough", function(){
      bgmOk = true;
      // 如果之前退回用了内置旋律，音乐就绪后自动切过去
      if (sndOn && !musicTimer && AC){ stopMusic(); startBgm(); }
    });
    bgm.addEventListener("loadeddata", function(){ bgmOk = true; });
    bgm.addEventListener("error", function(){ bgmOk = false; });
    bgm.addEventListener("playing", function(){
      if (musicTimer){ clearTimeout(musicTimer); musicTimer = null; }
      if (AC && AC.state === "running") AC.suspend();
    });
    bgm.volume = .55;
  }

  function startBgm(){
    if (!bgm) return false;
    try {
      bgm.muted = false;
      bgm.volume = .55;
      if (!bgm.currentSrc) bgm.load();
      var pr = bgm.play();
      if (pr && pr.catch){
        pr.catch(function(){ if (sndOn) playMusic(); });   // 真失败才兜底
      }
      // 1.6 秒后仍未真正开始播放，才退回内置旋律
      setTimeout(function(){
        if (sndOn && bgm.paused && !musicTimer) playMusic();
      }, 1600);
      return true;
    } catch (err){ return false; }
  }

  var sndBtn = document.getElementById("snd");
  function setSound(on){
    sndOn = on;
    sndBtn.classList.toggle("on", on);
    if (on){
      if (!startBgm()) playMusic();
    } else {
      if (bgm && !bgm.paused) bgm.pause();
      stopMusic();
    }
  }
  sndBtn.addEventListener("click", function(e){
    e.stopPropagation();
    setSound(!sndOn);
  });

  /* ================= 许愿 ================= */
  var wished = false;
  function wish(x, y){
    if (!wished){
      wished = true;
      confettiRain(56);
      hintEl.textContent = CONFIG.hintAfter;
      hbEl.classList.add("lit");
      setTimeout(function(){ hintEl.style.opacity = "0"; }, 3800);
      setTimeout(function(){
        var r = document.getElementById("flameG").getBoundingClientRect();
        burst(r.left + r.width / 2, r.top, 70, SHELLS[0]);
      }, 320);
    } else {
      confettiRain(14);
    }
  }

  /* ---------- 点头像：小惊喜档案卡 ---------- */
  var profileEl = document.getElementById("profile");
  var profileOpen = false;
  var faceHolder = document.getElementById("faceSrc");
  var pfImg = document.getElementById("pfImg");
  if (faceHolder && pfImg) pfImg.src = faceHolder.src;

  function hitAvatar(x, y){
    for (var i = 0; i < avatars.length; i++){
      var a = avatars[i];
      var dx = x - a.x, dy = y - a.y, rr = a.r + 10;
      if (dx * dx + dy * dy <= rr * rr) return true;
    }
    return false;
  }
  function openProfile(){
    if (profileOpen) return;
    profileOpen = true;
    profileEl.classList.add("on");
    // 兜底：过渡不推进的环境下，420ms 后落到无动画的最终态
    setTimeout(function(){
      if (profileOpen) profileEl.classList.add("final");
    }, 420);
    launch(W * .5, H * .26);
  }
  function closeProfile(){
    profileOpen = false;
    profileEl.classList.remove("on");
    profileEl.classList.remove("final");
  }

  document.addEventListener("pointerdown", function(e){
    if (e.target === sndBtn) return;
    if (profileOpen){ closeProfile(); return; }
    if (hitAvatar(e.clientX, e.clientY)){
      openProfile();
      return;
    }
    if (!sndOn) setSound(true);          // 第一次触碰即起音乐，之后按钮可关
    launch(e.clientX, e.clientY);
    wish(e.clientX, e.clientY);
  }, {passive:true});

  /* ================= 启动 ================= */
  window.addEventListener("resize", function(){ resize(); fitTitle(); });
  window.addEventListener("orientationchange", function(){
    setTimeout(function(){ resize(); syncFlame(); fitTitle(); }, 260);
  });

  try { resize(); } catch(err){ recordErr(err); }
  initFace();
  step((window.performance && performance.now) ? performance.now() : Date.now());
  // 布局晚到的兜底重算
  [200, 600, 1400].forEach(function(ms){
    setTimeout(function(){ try { resize(); } catch(err){ recordErr(err); } }, ms);
  });
  window.addEventListener("pageshow", function(){ try { resize(); } catch(err){} });
  setTimeout(typeCode, 500);
  setTimeout(function(){ confettiRain(16); }, 1400);
  setTimeout(syncFlame, 700);
  setTimeout(syncFlame, 1500);
  window.addEventListener("load", function(){ setTimeout(syncFlame, 150); });
  document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
})();

<script>
(function(){
  "use strict";

  var renderer;

  } catch (e){ return; }

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  if ("outputEncoding" in renderer) renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  camera.position.set(0, 1.86, 9.1);

  /* ---------- 环境反射 ---------- */
  function makeEnv(){
    var c = document.createElement("canvas");
    c.width = 512; c.height = 256;
    var g = c.getContext("2d");
    var lg = g.createLinearGradient(0, 0, 0, 256);
    lg.addColorStop(0, "#1d2f52"); lg.addColorStop(.42, "#0b1324"); lg.addColorStop(1, "#04070e");
    g.fillStyle = lg; g.fillRect(0, 0, 512, 256);
    var r1 = g.createRadialGradient(140, 52, 0, 140, 52, 108);

    g.fillStyle = r1; g.fillRect(0, 0, 512, 256);
    var r2 = g.createRadialGradient(382, 42, 0, 382, 42, 132);
    r2.addColorStop(0, "rgba(150,200,255,.8)"); r2.addColorStop(1, "rgba(150,200,255,0)");
    g.fillStyle = r2; g.fillRect(0, 0, 512, 256);
    var r3 = g.createRadialGradient(256, 210, 0, 256, 210, 150);

    g.fillStyle = r3; g.fillRect(0, 0, 512, 256);

  var pmrem = new THREE.PMREMGenerator(renderer);

  /* ---------- 灯光 ---------- */
  scene.add(new THREE.HemisphereLight(0x8fb2e8, 0x05080f, .34));
  var key = new THREE.DirectionalLight(0xcfe0ff, .95); key.position.set(3.4, 5.4, 4.2); scene.add(key);
  var rim = new THREE.DirectionalLight(0x6f9dff, .80); rim.position.set(-4.6, 2.4, -3.6); scene.add(rim);
  var flameLight = new THREE.PointLight(0xffb066, 2.4, 9, 2);
  flameLight.position.set(0, 2.7, 0);
  scene.add(flameLight);

  var cake = new THREE.Group();
  scene.add(cake);

  /* ---------- 盘子 ---------- */
  var plateMat = new THREE.MeshStandardMaterial({
    color: 0x1a2337, metalness: .95, roughness: .26, envMap: envMap, envMapIntensity: 1.2
  });
  var plate = new THREE.Mesh(new THREE.CylinderGeometry(1.42, 1.34, .07, 80), plateMat);
  plate.position.y = -.04;
  cake.add(plate);

  var ringMat = new THREE.MeshStandardMaterial({
    color: 0xbcd8ff, metalness: 1, roughness: .18, emissive: 0x2c4d85, emissiveIntensity: .55,
    envMap: envMap
  });
  var ring = new THREE.Mesh(new THREE.TorusGeometry(1.42, .011, 6, 110), ringMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = .002;
  cake.add(ring);

  /* 落地投影 */
  function shadowTex(){
    var c = document.createElement("canvas"); c.width = c.height = 256;
    var g = c.getContext("2d");
    var rg = g.createRadialGradient(128, 128, 10, 128, 128, 126);
    rg.addColorStop(0, "rgba(0,0,0,.75)");
    rg.addColorStop(.55, "rgba(0,0,0,.35)");
    rg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = rg; g.fillRect(0, 0, 256, 256);
    return new THREE.CanvasTexture(c);
  }
  var shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(3.6, 3.6),
    new THREE.MeshBasicMaterial({ map: shadowTex(), transparent: true, opacity: .85, depthWrite: false })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = -.09;
  cake.add(shadow);

  /* ---------- 蛋糕体 ---------- */

  /* ---------- 蛋糕体：程序化深空星云贴图 ---------- */
  function cakeTexture(){
    var w = 1024, h = 512;
    var c = document.createElement("canvas");
    c.width = w; c.height = h;
    var g = c.getContext("2d");

    var lg = g.createLinearGradient(0, 0, 0, h);
    lg.addColorStop(0, "#12203a");
    lg.addColorStop(.35, "#0b1526");
    lg.addColorStop(.75, "#070d18");
    lg.addColorStop(1, "#03060c");
    g.fillStyle = lg; g.fillRect(0, 0, w, h);

    // 星云
    function neb(cx, cy, r, col, alpha){
      var rg = g.createRadialGradient(cx, cy, 0, cx, cy, r);
      rg.addColorStop(0, col.replace("A", alpha));
      rg.addColorStop(.55, col.replace("A", alpha * .45));
      rg.addColorStop(1, col.replace("A", 0));
      g.fillStyle = rg;
      g.fillRect(cx - r, cy - r, r * 2, r * 2);
    }
    neb(180, 150, 300, "rgba(58,110,220,A)", .55);
    neb(720, 300, 320, "rgba(122,74,220,A)", .42);
    neb(470, 90, 240, "rgba(30,190,175,A)", .22);
    neb(880, 430, 220, "rgba(200,70,120,A)", .22);
    neb(60, 380, 200, "rgba(40,90,200,A)", .30);

    // 星尘：贴到圆柱后会缩小 5~6 倍，所以必须画大
    for (var i = 0; i < 460; i++){
      var x = Math.random() * w, y = Math.random() * h;
      var big = Math.random() < .16;
      var r = big ? 5 + Math.random() * 6 : 2.2 + Math.random() * 2.6;
      var a = .3 + Math.random() * .7;
      var warm = Math.random() < .4;
      var col = warm ? "255,232,180" : "215,235,255";
      var rg2 = g.createRadialGradient(x, y, 0, x, y, r * 2.2);
      rg2.addColorStop(0, "rgba(" + col + "," + a + ")");
      rg2.addColorStop(.35, "rgba(" + col + "," + (a * .55) + ")");
      rg2.addColorStop(1, "rgba(" + col + ",0)");
      g.fillStyle = rg2;
      g.beginPath(); g.arc(x, y, r * 2.2, 0, 6.2832); g.fill();
      g.fillStyle = "rgba(255,255,255," + Math.min(1, a + .25) + ")";
      g.beginPath(); g.arc(x, y, r * .5, 0, 6.2832); g.fill();
      if (big){
        g.strokeStyle = "rgba(255,250,235," + (a * .85) + ")";
        g.lineWidth = 1.6;
        g.lineCap = "round";
        g.beginPath();
        g.moveTo(x - r * 2.4, y); g.lineTo(x + r * 2.4, y);
        g.moveTo(x, y - r * 2.4); g.lineTo(x, y + r * 2.4);
        g.stroke();
      }
    }
    var t = new THREE.CanvasTexture(c);
    t.wrapS = THREE.RepeatWrapping;
    t.minFilter = THREE.LinearFilter;
    t.generateMipmaps = false;
    if ("colorSpace" in t) t.colorSpace = THREE.SRGBColorSpace;
    else if ("encoding" in t) t.encoding = THREE.sRGBEncoding;
    return t;
  }
  var bodyTex = cakeTexture();

  var bodyMat = new THREE.MeshPhysicalMaterial({
    map: bodyTex, emissiveMap: bodyTex, emissive: 0xffffff, emissiveIntensity: .45,
    roughness: .3, metalness: .22,
    clearcoat: 1, clearcoatRoughness: .12, envMapIntensity: .55
  });
  var body = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 2, 96, 1, true), bodyMat);
  body.position.y = 1.0;
  cake.add(body);

  /* 侧壁暗纹，让圆柱不至于太"塑料" */

  /* ---------- 顶部奶油 ---------- */
  var glazeMat = new THREE.MeshPhysicalMaterial({
    color: 0xf7fbff, roughness: .42, metalness: .02,
    clearcoat: 1, clearcoatRoughness: .14, envMapIntensity: .85
  });
  var glaze = new THREE.Mesh(new THREE.CylinderGeometry(1.042, 1.03, .15, 96), glazeMat);
  glaze.position.y = 2.03;
  cake.add(glaze);
  var glazeTop = new THREE.Mesh(new THREE.CircleGeometry(1.042, 96), glazeMat);
  glazeTop.rotation.x = -Math.PI / 2;
  glazeTop.position.y = 2.108;
  cake.add(glazeTop);

  /* 垂滴 */
  var dripMat = new THREE.MeshPhysicalMaterial({
    color: 0xf4f9ff, roughness: .38, clearcoat: 1, clearcoatRoughness: .16, envMapIntensity: 1
  });
  for (var d = 0; d < 7; d++){
    var a = d / 7 * Math.PI * 2 + Math.random() * .42;
    var len = .03 + Math.pow(Math.random(), 1.9) * .30;
    var rad = .034 + Math.random() * .026;
    var drip = new THREE.Mesh(new THREE.CapsuleGeometry(rad, len, 5, 14), dripMat);
    drip.position.set(Math.cos(a) * 1.020, 1.946 - (len + rad * 2) / 2, Math.sin(a) * 1.020);
    cake.add(drip);
  }

  /* ---------- 蜡烛 ---------- */
  var candleMat = new THREE.MeshPhysicalMaterial({
    color: 0xfffaf0, roughness: .42, clearcoat: .7, clearcoatRoughness: .25
  });
  var candle = new THREE.Mesh(new THREE.CylinderGeometry(.058, .058, .52, 24), candleMat);
  candle.position.y = 2.108 + .26;
  cake.add(candle);
  var wick = new THREE.Mesh(
    new THREE.CylinderGeometry(.008, .008, .1, 8),
    new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: .9 })
  );
  wick.position.y = 2.106 + .5 + .04;
  cake.add(wick);

  /* 火焰贴图 */
  function flameTex(){
    var c = document.createElement("canvas"); c.width = c.height = 128;
    var g = c.getContext("2d");
    var rg = g.createRadialGradient(64, 80, 2, 64, 80, 56);
    rg.addColorStop(0, "rgba(255,255,255,1)");
    rg.addColorStop(.12, "rgba(255,252,232,1)");
    rg.addColorStop(.3, "rgba(255,216,126,.94)");
    rg.addColorStop(.55, "rgba(255,152,52,.48)");
    rg.addColorStop(.8, "rgba(255,112,20,.12)");
    rg.addColorStop(1, "rgba(255,90,10,0)");
    g.fillStyle = rg;
    g.beginPath(); g.ellipse(64, 80, 33, 50, 0, 0, 6.2832); g.fill();
    var t = new THREE.CanvasTexture(c);
    return t;
  }
  var flameMat = new THREE.SpriteMaterial({
    map: flameTex(), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: .98
  });
  var flame = new THREE.Sprite(flameMat);
  flame.scale.set(.5, .64, 1);
  flame.position.y = 2.108 + .52 + .13;
  cake.add(flame);
  flameLight.position.y = flame.position.y;

  /* ---------- 表面星芒 ---------- */
  function starTex(){
    var S = 96, c = document.createElement("canvas");
    c.width = c.height = S;
    var g = c.getContext("2d");
    g.translate(S / 2, S / 2);
    var rg = g.createRadialGradient(0, 0, 0, 0, 0, S / 2);
    rg.addColorStop(0, "rgba(255,255,255,1)");
    rg.addColorStop(.16, "rgba(255,248,225,.92)");
    rg.addColorStop(.42, "rgba(255,224,170,.34)");
    rg.addColorStop(1, "rgba(255,210,150,0)");
    g.fillStyle = rg;
    g.beginPath(); g.arc(0, 0, S / 2, 0, 6.2832); g.fill();
    g.strokeStyle = "rgba(255,252,240,.95)";
    g.lineCap = "round";
    g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(-S/2, 0); g.lineTo(S/2, 0); g.stroke();
    g.beginPath(); g.moveTo(0, -S/2); g.lineTo(0, S/2); g.stroke();
    return new THREE.CanvasTexture(c);
  }
  var STAR_TEX = starTex();

  var layers = [];
  function starLayer(n, radius, y0, y1, sizeMin, sizeMax, phase){
    var pos = new Float32Array(n * 3), sizes = new Float32Array(n);
    for (var i = 0; i < n; i++){
      var a = Math.random() * Math.PI * 2;
      var y = y0 + Math.random() * (y1 - y0);
      pos[i * 3] = Math.cos(a) * radius;
      pos[i * 3 + 1] = y;
      pos[i * 3 + 2] = Math.sin(a) * radius;
      sizes[i] = sizeMin + Math.random() * (sizeMax - sizeMin);
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    var mat = new THREE.PointsMaterial({
      map: STAR_TEX,
      size: (sizeMin + sizeMax) * .5 * .34,
      sizeAttenuation: true,
      transparent: true, opacity: 1,
      blending: THREE.AdditiveBlending,
      depthWrite: false, depthTest: true
    });
    var pts = new THREE.Points(geo, mat);
    cake.add(pts);
    layers.push({ mat: mat, phase: phase });
    return pts;
  }
  starLayer(42, 1.008, .1, 1.96, .10, .20, 0);
  starLayer(16, 1.008, .12, 1.96, .26, .44, 1.7);
  starLayer(30, 1.022, 2.04, 2.10, .07, .16, 2.2);

  /* ---------- 尺寸 ---------- */
  function resize(){
    var w = cv.clientWidth || 320, h = cv.clientHeight || 330;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener("resize", resize);

  /* 把火焰位置投到屏幕，给外层喷星用 */
  var tmpV = new THREE.Vector3();
  function projectFlame(){
    tmpV.set(flame.position.x, flame.position.y, flame.position.z);
    cake.localToWorld(tmpV);
    tmpV.project(camera);
    var r = cv.getBoundingClientRect();
    window.FLAME_PT = {
      x: r.left + (tmpV.x * .5 + .5) * r.width,
      y: r.top + (-tmpV.y * .5 + .5) * r.height
    };
  }

  /* ---------- 渲染 ---------- */
  var clock = new THREE.Clock();
  var svgCake = document.querySelector("svg.cake");
  var firstFrame = true;

  var lastLoopAt = 0;
  function loop(){
    lastLoopAt = Date.now();
    var dt = Math.min(clock.getDelta(), .05);
    var t = clock.elapsedTime;

    cake.rotation.y += dt * .42;
    cake.rotation.x = Math.sin(t * .55) * .022;

    flame.scale.set(.5 + Math.sin(t * 8.6) * .02, .64 + Math.sin(t * 7.1) * .04, 1);
    flameLight.intensity = 2.1 + Math.sin(t * 10.5) * .32 + Math.sin(t * 3.3) * .14;

    for (var i = 0; i < layers.length; i++){
      layers[i].mat.opacity = .35 + .65 * (.5 + .5 * Math.sin(t * (1.15 + i * .35) + layers[i].phase));
    }

    projectFlame();
    renderer.render(scene, camera);

    if (firstFrame){
      firstFrame = false;
      if (svgCake) svgCake.style.display = "none";
    }
    requestAnimationFrame(loop);
  }
  loop();
  setInterval(function(){ if (Date.now() - lastLoopAt > 200) loop(); }, 80);
})();
</script>

</body>
</html>
